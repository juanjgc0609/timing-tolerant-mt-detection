name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    env:
      # BLAS as in the frozen runs (E31); ttmt.runtime.pin_blas() sets the same values before numpy loads
      OPENBLAS_CORETYPE: Prescott
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core lock and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r environments/core.lock.txt
          python -m pip install --no-deps -e .
      - name: BLAS in use
        run: python -c "from ttmt.runtime import pin_blas; pin_blas(); import numpy, json; from ttmt.runtime import blas_info; print(json.dumps(blas_info(), indent=1))"
      - name: Files in code/ not yet in the legacy index (informative; code/ is append-only)
        run: python tools/update_legacy_index.py --check || echo "::warning::code/ has unindexed files; run python tools/update_legacy_index.py"
      - name: Unit tests, legacy index and legacy equivalence
        run: python -m pytest -q -rs tests/test_unit.py tests/test_stats.py tests/test_legacy_index.py tests/test_legacy_equivalence.py tests/test_atlas.py
      - name: Regression (a), 2M from stored parts, exact
        # raw-data regressions (R0, R1) skip: TTMT_DATA_ROOT is not set on CI
        run: python -m pytest -q -rs --match exact tests/test_regression.py
